<!DOCTYPE html>
<html>
<head>
  <title>Parent Top-Up Portal</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f9;
      margin: 0;
      padding: 0;
    }
    .topup-container {
      max-width: 400px;
      margin: 80px auto;
      background: #ffffff;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      text-align: center;
    }
    .logo img {
      width: 100px;
      margin-bottom: 20px;
    }
    h2 {
      color: #d32f2f;
      margin-bottom: 20px;
    }
    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
      color: #333;
      text-align: left;
    }
    input, select {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
    button {
      margin-top: 20px;
      width: 100%;
      padding: 12px;
      background: #d32f2f;
      color: #fff;
      border: none;
      border-radius: 4px;
      font-size: 16px;
      cursor: pointer;
    }
    button:hover {
      background: #b71c1c;
    }
  </style>
</head>
<body>
  <div class="topup-container">
    <div class="logo">
      <img src="{{ url_for('static', filename='images/fcd_logo.png') }}" alt="FCD Logo">
    </div>

    <h2>Top-Up for {{ student.full_name }}</h2>
    <form action="{{ url_for('parent_topup', student_id=student.student_id) }}" method="POST">
      <label for="amount">Amount (₱):</label>
      <input type="number" id="amount" name="amount" min="1" required>

      <label for="payment_mode">Payment Mode:</label>
      <select id="payment_mode" name="payment_mode" required>
        <option value="cash">Cash</option>
        <option value="gcash">GCash</option>
        <option value="ewallet">E-Wallet</option>
      </select>

      <label for="reference_number">Reference Number:</label>
      <input type="text" id="reference_number" name="reference_number" required>

      <button type="submit">Submit Top-Up</button>
    </form>
  </div>
</body>
</html>
