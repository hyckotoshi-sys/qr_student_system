{% extends "base.html" %}
{% block content %}
<h2>Staff Transaction History</h2>

<table border="1">
    <tr><th>Student ID</th><th>Amount</th><th>Status</th><th>Date</th></tr>
    {% for t in transactions %}
    <tr>
        <td>{{ t[0] }}</td>
        <td>{{ t[1] }}</td>
        <td>{{ t[2] }}</td>
        <td>{{ t[3] }}</td>
    </tr>
    {% endfor %}
</table>
{% endblock %}
