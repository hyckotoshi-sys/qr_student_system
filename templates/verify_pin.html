<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Enter PIN</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-r from-purple-50 to-pink-50 min-h-screen flex items-center justify-center">

  <!-- PIN Card -->
  <div class="bg-white shadow-xl rounded-xl w-full max-w-md p-8 relative z-10">
    <!-- Logo watermark (behind form, not blocking clicks) -->
    <div class="absolute inset-0 opacity-5 bg-center bg-no-repeat pointer-events-none"
         style="background-image: url('{{ url_for('static', filename='images/bambini_logo.png') }}'); background-size: 250px;">
    </div>

    <h2 class="text-2xl font-bold text-center text-purple-700 mb-6">🔒 Enter Your 4‑Digit PIN</h2>

    <form method="POST" class="space-y-4 relative z-10">
      <div>
        <input type="password" name="pin" maxlength="4" required placeholder="PIN"
               class="w-full border rounded-lg p-3 text-center text-2xl tracking-widest focus:ring-2 focus:ring-purple-400 focus:outline-none">
      </div>

      <button type="submit"
              class="w-full bg-gradient-to-r from-green-500 to-green-600 text-white py-2 rounded-lg shadow-md hover:from-green-600 hover:to-green-700 transition">
        Verify PIN
      </button>
    </form>

    <p class="text-center text-sm mt-4">
      <a href="{{ url_for('forgot_pin') }}" class="text-blue-600 hover:underline">Forgot PIN?</a>
    </p>
  </div>

</body>
</html>
