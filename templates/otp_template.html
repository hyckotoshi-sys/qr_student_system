<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>OTP Verification</title>
    <style>
        body { font-family: Arial, sans-serif; }
        .otp-box {
            border: 1px solid #ccc;
            padding: 20px;
            margin: 20px auto;
            max-width: 400px;
            text-align: center;
            background-color: #ebd5e9;
            border-radius: 8px;
        }
        .otp-code {
            font-size: 24px;
            font-weight: bold;
            color: #d000ff;
        }
    </style>
</head>
<body>
    <div class="otp-box">
        <h2>{{ role|capitalize }} OTP Verification</h2>
        <p>Your one‑time password is:</p>
        <p class="otp-code">{{ otp }}</p>
        <p>This code will expire in 5 minutes. Please do not share it with anyone.</p>
    </div>
</body>
</html>
