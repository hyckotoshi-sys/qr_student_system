{% extends "base.html" %}
{% block content %}
<h2>Confirm Transaction</h2>
<p>Please enter your 4-digit PIN to confirm this transaction.</p>

<form method="POST">
    <label>PIN:</label>
    <input type="password" name="pin" maxlength="4" required><br><br>
    <button type="submit">Confirm</button>
</form>
{% endblock %}
