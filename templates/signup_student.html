<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Student Sign Up</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-r from-purple-50 to-pink-50 min-h-screen flex items-center justify-center">

  <!-- Signup Card -->
  <div class="bg-white shadow-xl rounded-xl w-full max-w-lg p-8 relative z-10">
    <!-- Logo watermark (behind form, not blocking clicks) -->
    <div class="absolute inset-0 opacity-5 bg-center bg-no-repeat pointer-events-none"
         style="background-image: url('{{ url_for('static', filename='images/bambini_logo.png') }}'); background-size: 300px;">
    </div>

    <!-- Logo -->
    <div class="flex justify-center mb-4">
      <img src="{{ url_for('static', filename='images/bambini_logo.png') }}" alt="Bambini Logo" class="w-24 rounded-full shadow-md">
    </div>

    <h2 class="text-2xl font-bold text-center text-purple-700 mb-6">📝 Student Sign Up</h2>

    <form action="{{ url_for('signup_student') }}" method="POST" onsubmit="return validateForm()" class="space-y-4 relative z-10">
  <!-- Full Name -->
  <div>
    <label for="full_name" class="block text-sm font-medium text-gray-700">Full Name</label>
    <input type="text" id="full_name" name="full_name" required
           autocomplete="name"
           class="w-full border rounded-lg p-2 focus:ring-2 focus:ring-purple-400 focus:outline-none">
  </div>

  <!-- School ID -->
  <div>
    <label for="school_id" class="block text-sm font-medium text-gray-700">School ID (7 digits)</label>
    <input type="text" id="school_id" name="school_id" required pattern="\d{7}" title="Must be exactly 7 digits"
           autocomplete="off"
           class="w-full border rounded-lg p-2 focus:ring-2 focus:ring-purple-400 focus:outline-none">
  </div>

  <!-- Student Email -->
  <div>
    <label for="email" class="block text-sm font-medium text-gray-700">Student Email (@gmail.com)</label>
    <input type="email" id="email" name="email" required pattern="^[a-zA-Z0-9._%+-]+@gmail\.com$"
           autocomplete="email"
           class="w-full border rounded-lg p-2 focus:ring-2 focus:ring-purple-400 focus:outline-none">
  </div>

  <!-- Guardian Name -->
  <div>
    <label for="guardian_name" class="block text-sm font-medium text-gray-700">Guardian Name</label>
    <input type="text" id="guardian_name" name="guardian_name" required
           autocomplete="name"
           class="w-full border rounded-lg p-2 focus:ring-2 focus:ring-purple-400 focus:outline-none">
  </div>

  <!-- Parent Email -->
  <div>
    <label for="parent_email" class="block text-sm font-medium text-gray-700">Parent Email (@gmail.com)</label>
    <input type="email" id="parent_email" name="parent_email" required pattern="^[a-zA-Z0-9._%+-]+@gmail\.com$"
           autocomplete="email"
           class="w-full border rounded-lg p-2 focus:ring-2 focus:ring-purple-400 focus:outline-none">
  </div>

  <!-- Contact Number -->
  <div>
    <label for="contact_number" class="block text-sm font-medium text-gray-700">Contact Number (11 digits, starts with 09)</label>
    <input type="text" id="contact_number" name="contact_number" required pattern="^09\d{9}$"
           autocomplete="tel"
           class="w-full border rounded-lg p-2 focus:ring-2 focus:ring-purple-400 focus:outline-none">
  </div>

  <!-- Grade Level -->
  <div>
    <label for="grade_level" class="block text-sm font-medium text-gray-700">Grade Level</label>
    <select id="grade_level" name="grade_level" required
            autocomplete="off"
            class="w-full border rounded-lg p-2 focus:ring-2 focus:ring-purple-400 focus:outline-none">
      <option value="">Select Grade</option>
      <option value="Grade 11">Grade 11</option>
      <option value="Grade 12">Grade 12</option>
    </select>
  </div>

  <!-- Strand -->
  <div>
    <label for="strand" class="block text-sm font-medium text-gray-700">Strand</label>
    <select id="strand" name="strand" required
            autocomplete="off"
            class="w-full border rounded-lg p-2 focus:ring-2 focus:ring-purple-400 focus:outline-none">
      <option value="">Select Strand</option>
      <option value="STEM">STEM</option>
      <option value="ABM">ABM</option>
      <option value="GAS">GAS</option>
      <option value="TVL">TVL</option>
      <option value="HUMMS">HUMMS</option>
    </select>
  </div>

  <!-- Password -->
  <div>
    <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
    <input type="password" id="password" name="password" required
           autocomplete="new-password"
           class="w-full border rounded-lg p-2 focus:ring-2 focus:ring-purple-400 focus:outline-none">
    <small class="text-gray-500">Must be at least 8 characters, include uppercase, lowercase, number, and special character.</small>
  </div>

  <!-- Confirm Password -->
  <div>
    <label for="confirm_password" class="block text-sm font-medium text-gray-700">Confirm Password</label>
    <input type="password" id="confirm_password" name="confirm_password" required
           autocomplete="new-password"
           class="w-full border rounded-lg p-2 focus:ring-2 focus:ring-purple-400 focus:outline-none">
  </div>

  <!-- Security Question 1 -->
  <div>
    <label for="security_q1" class="block text-sm font-medium text-gray-700">Security Question 1</label>
    <select id="security_q1" name="security_q1" required autocomplete="off"
            class="w-full border rounded-lg p-2 focus:ring-2 focus:ring-purple-400 focus:outline-none">
      <option value="">Select a question</option>
      <option value="mother_maiden">What is your mother’s maiden name?</option>
      <option value="first_pet">What was your first pet’s name?</option>
      <option value="birth_city">What city were you born in?</option>
    </select>
    <input type="text" id="security_a1" name="security_a1" placeholder="Answer" required
           autocomplete="off"
           class="w-full border rounded-lg p-2 mt-2 focus:ring-2 focus:ring-purple-400 focus:outline-none">
  </div>

  <!-- Security Question 2 -->
  <div>
    <label for="security_q2" class="block text-sm font-medium text-gray-700">Security Question 2</label>
    <select id="security_q2" name="security_q2" required autocomplete="off"
            class="w-full border rounded-lg p-2 focus:ring-2 focus:ring-purple-400 focus:outline-none">
      <option value="">Select a question</option>
      <option value="first_school">What was the name of your first school?</option>
      <option value="best_friend">What is the name of your childhood best friend?</option>
    </select>
    <input type="text" id="security_a2" name="security_a2" placeholder="Answer" required
           autocomplete="off"
           class="w-full border rounded-lg p-2 mt-2 focus:ring-2 focus:ring-purple-400 focus:outline-none">
  </div>

  <!-- Security Question 3 -->
  <div>
    <label for="security_q3" class="block text-sm font-medium text-gray-700">Security Question 3</label>
    <select id="security_q3" name="security_q3" required autocomplete="off"
            class="w-full border rounded-lg p-2 focus:ring-2 focus:ring-purple-400 focus:outline-none">
      <option value="">Select a question</option>
      <option value="favorite_book">What is your favorite book?</option>
      <option value="favorite_color">What is your favorite color?</option>
    </select>
    <input type="text" id="security_a3" name="security_a3" placeholder="Answer" required
           autocomplete="off"
           class="w-full border rounded-lg p-2 mt-2 focus:ring-2 focus:ring-purple-400 focus:outline-none">
  </div>

  <!-- Submit -->
  <button type="submit"
          class="w-full bg-gradient-to-r from-purple-500 to-pink-500 text-white py-2 rounded-lg shadow-md hover:from-purple-600 hover:to-pink-600 transition">
    Sign Up
  </button>
</form>


    <!-- Link to Signin -->
    <p class="text-center text-sm text-gray-600 mt-4">
      Already have an account?
      <a href="{{ url_for('signin_student') }}" class="text-purple-600 hover:underline">Sign in here</a>
    </p>
  </div>

  <script>
    function validateForm() {
      const password = document.getElementById("password").value;
      const confirmPassword = document.getElementById("confirm_password").value;
      const passwordRegex = /^(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[\W_]).{8,}$/;

      if (!passwordRegex.test(password)) {
        alert("Password must be at least 8 characters and include uppercase, lowercase, number, and special character.");
        return false;
      }
      if (password !== confirmPassword) {
        alert("Passwords do not match.");
        return false;
      }
      return true;
    }
  </script>
</body>
</html>
