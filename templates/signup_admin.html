<!DOCTYPE html>
<html>
<head>
  <title>Admin Sign Up</title>
</head>
<body>
  <h2>Admin Sign Up</h2>
  <form action="{{ url_for('signup_admin') }}" method="POST">
    <label for="full_name">Full Name:</label>
    <input type="text" id="full_name" name="full_name" required><br>

    <label for="contact_number">Contact Number:</label>
    <input type="text" id="contact_number" name="contact_number" required><br>

    <label for="email">Email Address:</label>
    <input type="email" id="email" name="email" required><br>

    <label for="password">Password:</label>
    <input type="password" id="password" name="password" required><br>

    <label for="pin">Enter 4-digit PIN:</label>
    <input type="password" id="pin" name="pin" maxlength="4" required><br>

    <!-- Security Questions -->
    <label for="security_q1">Security Question 1:</label>
    <select id="security_q1" name="security_q1" required>
      <option value="mother_maiden">Mother’s maiden name?</option>
      <option value="birth_city">City of birth?</option>
      <option value="favorite_food">Favorite food?</option>
      <option value="favorite_teacher">Favorite teacher’s name?</option>
      <option value="nickname">Childhood nickname?</option>
    </select><br>
    <input type="text" id="security_a1" name="security_a1" required><br>

    <label for="security_q2">Security Question 2:</label>
    <select id="security_q2" name="security_q2" required>
      <option value="first_school">First school?</option>
      <option value="best_friend">Childhood best friend?</option>
      <option value="dream_job">Dream job as a child?</option>
      <option value="favorite_subject">Favorite subject?</option>
      <option value="favorite_movie">Favorite movie?</option>
    </select><br>
    <input type="text" id="security_a2" name="security_a2" required><br>

    <label for="security_q3">Security Question 3:</label>
    <select id="security_q3" name="security_q3" required>
      <option value="favorite_book">Favorite book?</option>
      <option value="favorite_color">Favorite color?</option>
      <option value="favorite_song">Favorite song?</option>
      <option value="first_car">First car model?</option>
      <option value="hobby">Favorite hobby?</option>
    </select><br>
    <input type="text" id="security_a3" name="security_a3" required><br>

    <button type="submit">Sign Up</button>
  </form>
</body>
</html>
