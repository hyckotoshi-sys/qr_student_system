<!DOCTYPE html>
<html>
<head>
    <title>Submit Top-Up</title>
</head>
<body>
    <h2>Top-Up Request</h2>
    <form action="{{ url_for('topup') }}" method="POST" enctype="multipart/form-data">
        <!-- Payment Method -->
        <label for="method">Payment Method:</label>
        <select name="method" id="method" required>
            <option value="ewallet">E-Wallet</option>
            <option value="bank">Bank Transfer</option>
        </select>
        <br><br>

        <!-- Amount -->
        <label for="amount">Amount:</label>
        <input type="number" step="0.01" name="amount" id="amount" required>
        <br><br>

        <!-- Screenshot Upload -->
        <label for="screenshot">Upload Screenshot:</label>
        <input type="file" name="screenshot" id="screenshot" accept="image/*" required>
        <br><br>

        <button type="submit">Submit Top-Up</button>
    </form>
</body>
</html>
