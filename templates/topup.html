{% extends "base.html" %}
{% block content %}
<h2>GCash Top-Up</h2>

<form action="{{ url_for('submit_topup') }}" method="POST" enctype="multipart/form-data">
    <label for="gcash_number">GCash Number:</label>
    <input type="text" name="gcash_number" id="gcash_number" value="{{ student.gcash_number }}" readonly required>
    <br><br>

    <label for="gcash_owner">GCash Owner:</label>
    <input type="text" name="gcash_owner" id="gcash_owner" value="{{ student.gcash_owner }}" readonly required>
    <br><br>

    <label for="reference_number">Reference Number:</label>
    <input type="text" name="reference_number" id="reference_number" required>
    <br><br>

    <label for="amount">Amount:</label>
    <input type="number" step="0.01" name="amount" id="amount" required>
    <br><br>

    <label for="proof">Upload Screenshot:</label>
    <input type="file" name="proof" id="proof" accept="image/*" required>
    <br><br>

    <button type="submit">Submit Top-Up</button>
</form>


<a href="{{ url_for('dashboard_student') }}">Back to Dashboard</a>
{% endblock %}
