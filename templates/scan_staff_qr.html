<!DOCTYPE html>
<html>
<head>
    <title>Scan Staff QR</title>
    <script src="https://unpkg.com/html5-qrcode"></script>
</head>
<body>
    <h2>Scan Staff QR</h2>
    <div id="reader" style="width:300px"></div>

    <form id="scanForm" action="/scan_staff_qr" method="POST">
        <input type="hidden" name="staff_token" id="staff_token">
        <button type="submit">Confirm Scan</button>
    </form>

    <script>
        function onScanSuccess(decodedText, decodedResult) {
            document.getElementById("staff_token").value = decodedText;
            alert("Staff QR scanned: " + decodedText);
        }

        const html5QrCode = new Html5Qrcode("reader");
        html5QrCode.start(
            { facingMode: "environment" }, 
            { fps: 10, qrbox: 250 },
            onScanSuccess
        );
    </script>
</body>
</html>
