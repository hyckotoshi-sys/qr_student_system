<!doctype html>
<html>
<head>
  <title>Students</title>
</head>
<body>
  <h1>Students</h1>

  <!-- Only admins will see this form -->
  {% if session['user']['role'] == 'admin' %}
  <h2>Add New Student</h2>
  <form method="POST" action="/students">
    <label>Name:</label>
    <input type="text" name="name" required><br>

    <label>Email:</label>
    <input type="email" name="email" required><br>

    <label>Grade Level:</label>
    <input type="text" name="grade_level" required><br>

    <label>PIN:</label>
    <input type="text" name="pin" required><br>

    <label>Balance:</label>
    <input type="number" step="0.01" name="balance" value="0.00"><br>

    <label>Role:</label>
    <select name="role">
      <option value="student">Student</option>
      <option value="admin">Admin</option>
    </select><br>

    <button type="submit">Add Student</button>
  </form>
  {% endif %}

  <h2>Student List</h2>
  <table border="1">
    <tr><th>ID</th><th>Name</th><th>Email</th><th>Grade</th><th>Balance</th></tr>
    {% for s in students %}
    <tr>
      <td>{{ s.student_id }}</td>
      <td>{{ s.name }}</td>
      <td>{{ s.email }}</td>
      <td>{{ s.grade_level }}</td>
      <td>{{ s.balance }}</td>
    </tr>
    {% endfor %}
  </table>

  <a href="/dashboard">Back</a>
</body>
</html>
