<!DOCTYPE html>
<html>
<head>
  <title>Login</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f4f4;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .login-box {
      background: #fff;
      padding: 30px;
      border-radius: 8px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
      width: 350px;
    }
    h2 {
      text-align: center;
      margin-bottom: 20px;
    }
    input {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border: 1px solid #ccc;
      border-radius: 6px;
    }
    button {
      width: 100%;
      padding: 10px;
      background: #1E3A8A;
      color: #fff;
      border: none;
      border-radius: 6px;
      cursor: pointer;
    }
    button:hover {
      background: #0f1f5c;
    }
    .links {
      text-align: center;
      margin-top: 15px;
    }
    .links a {
      color: #1E3A8A;
      text-decoration: none;
      margin: 0 5px;
    }
  </style>
</head>
<body>
  <div class="login-box">
    <h2>Login</h2>
    <form action="{{ url_for('login') }}" method="POST">
      <input type="email" name="email" placeholder="Email" required>
      <input type="password" name="password" placeholder="Password" required>
      <button type="submit">Log In</button>
    </form>
    <div class="links">
      <p>No account? 
        <a href="{{ url_for('signup_student') }}">Student Sign Up</a> | 
        <a href="{{ url_for('signup_admin') }}">Admin Sign Up</a> | 
        <a href="{{ url_for('signup_staff') }}">Staff Sign Up</a>
      </p>
      <p><a href="{{ url_for('reset') }}">Forgot Password?</a></p>
    </div>
  </div>
</body>
</html>
