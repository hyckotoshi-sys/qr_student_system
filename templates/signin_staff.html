<!DOCTYPE html>
<html>
<head>
  <title>Staff Sign In</title>
  <style>
    body { font-family:Arial, sans-serif; background:#f9fafb; padding:40px; }
    .card { background:#fff; padding:20px; border-radius:8px; box-shadow:0 2px 6px rgba(0,0,0,0.1); width:300px; margin:auto; }
    .btn { display:block; margin-top:15px; padding:10px; text-align:center; border-radius:5px; text-decoration:none; }
    .btn-primary { background:#22c55e; color:#fff; }
    .btn-secondary { background:#6b7280; color:#fff; }
  </style>
</head>
<body>
  <div class="card">
    <h2>Staff Login</h2>
    <form action="{{ url_for('signin_staff') }}" method="POST">
      <input type="email" name="email" placeholder="Email" required style="width:100%; padding:8px; margin:10px 0;">
      <input type="password" name="password" placeholder="Password" required style="width:100%; padding:8px; margin:10px 0;">
      <button type="submit" class="btn btn-primary">Login</button>
    </form>
    <a href="{{ url_for('signup_staff') }}" class="btn btn-secondary">No account? Sign Up</a>
  </div>
</body>
</html>
